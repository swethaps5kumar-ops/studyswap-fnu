<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — StudySwap FNU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <a class="wordmark" href="index.html">Study<span>Swap</span> FNU</a>
    <nav><a href="register.html">Register</a></nav>
  </div>

  <div class="auth-wrap">
    <div class="auth-side">
      <p class="eyebrow">StudySwap FNU</p>
      <h2>Welcome back to the campus marketplace.</h2>
      <ul>
        <li>Find textbooks, dorm gear and supplies from fellow students</li>
        <li>Chat with sellers and reserve items</li>
        <li>List your own items with a photo in under a minute</li>
      </ul>
    </div>
    <div class="auth-main">
      <div class="auth-card">
        <p class="eyebrow">Welcome back</p>
        <h1>Log in</h1>
        <div id="alert" class="alert hidden"></div>
        <form id="loginForm">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="email" placeholder="you@student.fnu.ac.fj" />

          <label for="password">Password</label>
          <input id="password" type="password" required autocomplete="current-password" />

          <button type="submit" class="btn-gold btn-block" style="margin-top:22px; padding:12px;" id="submitBtn">Log in</button>
        </form>
        <p class="form-footer">New here? <a href="register.html">Create an account</a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
