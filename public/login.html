<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — StudySwap FNU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/home.css" />
</head>
<body>
  <div class="topbar">
    <a class="wordmark" href="index.html">Study<span>Swap</span> FNU</a>
    <nav><a href="register.html">Register</a></nav>
  </div>

  <div class="auth-wrap">
    <div class="auth-side">
      <h1>Your next textbook is already on campus.</h1>
      <p class="lead">Log in to chat with sellers, reserve items and list your own.</p>
      <div class="board mini" aria-hidden="true">
        <div class="note n1">
          <span class="stamp">AVAILABLE</span>
          <svg viewBox="0 0 40 40" fill="none" stroke="#16233F" stroke-width="2.2" stroke-linejoin="round"><path d="M6 8h11a3 3 0 0 1 3 3v22a3 3 0 0 0-3-3H6zM34 8H23a3 3 0 0 0-3 3v22a3 3 0 0 1 3-3h11z"/></svg>
          <h3>Calculus textbook</h3><div class="p">FJ$35.00</div><p class="by">Seller: Ana</p>
        </div>
        <div class="note n2">
          <span class="stamp">AVAILABLE</span>
          <svg viewBox="0 0 40 40" fill="none" stroke="#16233F" stroke-width="2.2" stroke-linejoin="round"><rect x="9" y="4" width="22" height="32" rx="3"/><rect x="13" y="8" width="14" height="7" rx="1"/><path d="M14 22h2M19 22h2M24 22h2M14 28h2M19 28h2M24 28h2"/></svg>
          <h3>Scientific calculator</h3><div class="p">FJ$20.00</div><p class="by">Seller: Jone</p>
        </div>
      </div>
    </div>
    <div class="auth-main">
      <div class="auth-card">
        <p class="eyebrow">Welcome back</p>
        <h1>Log in</h1>
        <div id="alert" class="alert hidden"></div>
        <form id="loginForm">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="email" placeholder="you@student.fnu.ac.fj" />

          <label for="password">Password</label>
          <input id="password" type="password" required autocomplete="current-password" />

          <button type="submit" class="btn-gold btn-block" style="margin-top:22px; padding:12px;" id="submitBtn">Log in</button>
        </form>
        <p class="form-footer">New here? <a href="register.html">Create an account</a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
