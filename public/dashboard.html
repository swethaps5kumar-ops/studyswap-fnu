<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — StudySwap FNU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <a class="wordmark" href="dashboard.html">Study<span>Swap</span> FNU</a>
    <nav>
      <span class="userchip" id="userChip"></span>
      <button id="logoutBtn">Log out</button>
    </nav>
  </div>

  <div class="container">
    <div class="page-title">
      <div>
        <p class="eyebrow">Marketplace</p>
        <h1 id="pageHeading">Browse listings</h1>
      </div>
      <button id="newListingBtn" class="btn-gold">+ Sell an item</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="browse">Browse</button>
      <button class="tab-btn" data-tab="mine">My listings</button>
    </div>

    <div id="browseTab">
      <div class="search-bar">
        <input id="searchInput" placeholder="Search by title or keyword (e.g. calculator, mini fridge)" />
        <button id="searchBtn" class="btn-outline">Search</button>
      </div>
      <div id="browseGrid" class="tag-grid"></div>
      <p id="browseEmpty" class="empty-state hidden">No items match your search yet. Try another keyword.</p>
    </div>

    <div id="mineTab" class="hidden">
      <div id="mineGrid" class="tag-grid"></div>
      <p id="mineEmpty" class="empty-state hidden">You haven't listed anything yet. Tap "+ Sell an item" to get started.</p>
    </div>
  </div>

  <!-- New listing form (toggled) -->
  <div id="newListingPanel" class="container hidden" style="max-width:520px;">
    <div class="card">
      <h2>List an item for sale</h2>
      <div id="listingAlert" class="alert hidden"></div>
      <form id="newListingForm">
        <label for="title">Title</label>
        <input id="title" required placeholder="e.g. TI-84 Plus Calculator" />

        <label for="price">Price (FJD)</label>
        <input id="price" type="number" min="0" step="0.01" required placeholder="25.00" />

        <label for="keywords">Keywords <span class="muted">(comma-separated, helps buyers find it)</span></label>
        <input id="keywords" placeholder="calculator, math, TI-84" />

        <label for="description">Description</label>
        <textarea id="description" placeholder="Condition, pickup location, etc."></textarea>

        <label for="image">Photo <span class="muted">(optional, any size - it is shrunk automatically)</span></label>
        <input id="image" type="file" accept="image/*" />
        <img id="imagePreview" class="hidden" alt="Selected photo preview" style="margin-top:10px; max-width:100%; max-height:200px; border-radius:8px; border:1px solid var(--line);" />

        <div style="display:flex; gap:10px; margin-top:20px;">
          <button type="submit" class="btn-gold">Post listing</button>
          <button type="button" id="cancelListingBtn" class="btn-outline">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
